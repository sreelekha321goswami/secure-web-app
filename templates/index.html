<!DOCTYPE html>
<html>
<head>
    <title>Secure Web App</title>
</head>
<body>
    <h1>Secure Development Environment is Working!</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p><strong>{{ category }}:</strong> {{ message }}</p>
      {% endfor %}
    {% endwith %}

    <p><a href="{{ url_for('register') }}">Register</a></p>
</body>
</html>
